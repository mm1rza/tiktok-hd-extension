<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="only light">
  <title>Senzeyn × TikTok</title>
  <style>
    :root { color-scheme: only light; }
    html, body { background: #0a0a0b !important; color: #f5f5f5 !important; color-scheme: only light; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/ui.css">
</head>
<body>

  <div class="bg-ambient"></div>

  <div id="mainView">
    <div class="di-wrap">
      <div class="di-island" id="diIsland">
        <div class="di-icon">
          <svg viewBox="0 0 24 24">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.75a4.85 4.85 0 0 1-1.01-.06z"/>
          </svg>
        </div>
        <span class="di-label" id="injectText">Checking...</span>
        <div class="di-expanded-content">
          <div class="di-expanded-title" id="diExpandedTitle">Bypass Off</div>
          <div class="di-expanded-sub"   id="diExpandedSub">Activate Button</div>
        </div>
      </div>
    </div>

    <div class="header">
    </div>
    <div class="h1-top" id="h1Top"></div>
    <p class="subtitle">Tools For High Quality TikTok Upload</p>

    <div class="divider anim-enter" id="animDivider"></div>

    <div class="card anim-enter" id="injectBadge">
      <button class="feat-toggle" id="featToggle">
        <div class="feat-toggle-left">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          System Features
        </div>
        <svg class="feat-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="feat-body" id="featBody">
        <div class="feat-inner">
          <ul class="feat-list">
            <li>High Quality Upload Tiktok</li>
            <li>Support Up to 1080P 60FPS</li>
            <li>Lossless Upload 0 Compression</li>
            <li>Added Sound & Music Support</li>
            <li>Support Mobile & PC</li>
          </ul>
        </div>
      </div>
    </div>

    <div class="vpn-card anim-enter" id="customCard1">
      <div class="vpn-left">
       <div class="vpn-dot vpn-dot--bolt"></div>
        <div class="vpn-text-group">
          <div class="vpn-title" id="customCard1Title">Bypass 1080/60FPS</div>
          <div class="vpn-sub"   id="customCard1Sub" style="display:none"></div>
          <div class="vpn-sub">Full High Quality Uploads</div>
        </div>
      </div>
      <label class="vpn-switch">
        <input type="checkbox" id="customToggle1">
        <span class="vpn-slider"></span>
      </label>
    </div>

    <a href="https://www.tiktok.com/tiktokstudio/upload?from=webapp" target="_blank" class="fps-converter-card anim-enter" id="extraLinkCard">
      <span class="fps-converter-text">Tiktok Upload Page</span>
    </a>

  

  </div>
  
  <script src="src/index.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
